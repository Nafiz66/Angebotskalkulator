<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filder-Clean Angebotskalkulator</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14212b;--mu:#5d6b77;--bd:#d9e0e6;--pr:#3f7fc0;--prt:#fff;--ok:#e6f4ea;--ac:#e6f4fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--card:#19232a;--tx:#e9eef2;--mu:#98a7b3;--bd:#2b3942;--pr:#3fb0d6;--prt:#06222c;--ok:#16301f;--ac:#17303b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.steps{display:flex;gap:6px;margin:10px 0 14px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--bd)}.steps .on{background:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin-top:14px}.chk input{width:22px;height:22px}
.nav{display:flex;gap:10px;margin-top:14px}
button{font:inherit;font-weight:600;padding:13px 18px;border-radius:10px;border:1px solid var(--pr);background:var(--pr);color:var(--prt);cursor:pointer;flex:1}
button.sec{background:transparent;color:var(--pr)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:transparent;color:var(--pr)}.tabs button.on{background:var(--pr);color:var(--prt)}
.err{color:#c0392b;font-size:14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}td.r,th.r{text-align:right;white-space:nowrap}
.tot td{font-weight:700;border-bottom:none}
.big{font-size:26px;font-weight:800;color:var(--pr)}
.pill{display:inline-block;background:var(--ac);color:var(--pr);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.mach{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px dashed var(--bd);border-radius:8px;margin-bottom:8px;background:var(--ok)}
.mach b{display:block}.mach span{font-size:13px;color:var(--mu)}
.offer{background:#fff;color:#111;border:1px solid var(--bd);border-radius:12px;padding:22px}
.offer td,.offer th{border-color:#ddd}.offer .mu{color:#555;font-size:13px}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:inline-block}.logo img{display:block;height:64px;width:auto}.hd .logo{padding:0;border-radius:0}.hd .logo img{height:70px}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #3f7fc0;padding-bottom:10px;margin-bottom:14px}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{background:transparent;color:var(--pr)}.seg button.on{background:var(--pr);color:var(--prt)}
.offer .seg button{color:#3f7fc0;border-color:#3f7fc0}.offer .seg button.on{background:#3f7fc0;color:#fff}
@media print{body{background:#fff}.noprint{display:none!important}.offer{border:none;padding:0}.card{border:none;padding:0}}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
</style>
</head>

    <h1>Angebotskalkulator</h1>
    <p class="sub">Akquise-Bogen mit automatischer Kalkulation und Maschinen-Check</p>
    <div class="steps" id="steps"></div>
  </div>
  <div id="main"></div>
</div>
<script>
"use strict";
const OBJ={buero:{n:"Büro/Gewerbe",f:1},hotel:{n:"Hotel",f:.85},industrie:{n:"Industrie/Halle",f:1.1},baustelle:{n:"Baustelle",f:1},privat:{n:"Privathaushalt",f:.9}};
const SRV={unterhalt:{n:"Unterhaltsreinigung",v:350},grund:{n:"Grund-/Sonderreinigung",v:60},glas:{n:"Glas-/Solarreinigung",v:40},bau:{n:"Bauendreinigung",v:100},haus:{n:"Hausmeister/Dachrinne",v:200}};
const FREQ={einmalig:{n:"Einmalig",w:0,m:1},taeglich:{n:"Täglich (Mo–Fr)",w:5,m:5*52/12},woechentlich:{n:"Wöchentlich",w:1,m:52/12},zweiwoechig:{n:"14-tägig",w:.5,m:26/12}};
const DIRT={leicht:{n:"Leicht",f:1.25},normal:{n:"Normal",f:1},stark:{n:"Stark",f:.7},extrem:{n:"Extrem",f:.5}};
const GLASS_V=40, SAN_H=.2, KIT_H=.4, MIN_H=1;
const TEXT={
 unterhalt:["Regelmäßige Reinigung aller Böden, Flächen und Oberflächen","Entleeren der Abfallbehälter","Hygienische Reinigung der Sanitär- und Küchenbereiche"],
 grund:["Intensive Grund-/Sonderreinigung der Böden und Flächen","Entfernen von hartnäckigen Verschmutzungen und Pflegefilmen","Maschinelle Reinigung, wo erforderlich"],
 glas:["Reinigung von Glas- und Fensterflächen inkl. Rahmen","Reinigung von Solar-/Photovoltaikflächen mit Osmose-Verfahren","Streifenfreies Ergebnis ohne Reinigungsmittelrückstände"],
 bau:["Bauendreinigung nach Abschluss der Arbeiten","Entfernen von Bauschmutz, Staub, Farb- und Mörtelresten","Besenreine und bezugsfertige Übergabe"],
 haus:["Hausmeisterservice (Kontrolle, Kleinreparaturen, Außenanlagen)","Reinigung der Dachrinnen und Abläufe","Dokumentation der durchgeführten Arbeiten"]};
const S={step:0,tab:"angebot",model:"pausch",
 d:{obj:"buero",srv:"unterhalt",area:"",rooms:"",san:"",kit:"",freq:"woechentlich",glass:"",dirt:"normal",carpet:false,kunde:"",adresse:""},
 p:{wage:18,lnk:21,gk:15,gew:12,mwst:19}};
const $=s=>document.querySelector(s);
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const num=(n,d=1)=>n.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${v.n}</option>`).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Kalkulations-Engine ---------- */
function calc(){
 const d=S.d,p=S.p,a=+d.area||0,g=+d.glass||0,rm=+d.rooms||0,sa=+d.san||0,ki=+d.kit||0;
 const rows=[];
 const dirtF=(d.srv==="grund"||d.srv==="bau")?DIRT[d.dirt].f:1;
 const sp=SRV[d.srv].v*OBJ[d.obj].f*dirtF;
 if(d.srv==="glas"){ if(g) rows.push(["Glas-/Solarflächen",`${num(g,0)} m² ÷ ${GLASS_V} m²/h`,g/GLASS_V]); }
 else{
  rows.push(["Flächenleistung",`${num(a,0)} m² ÷ ${num(sp,0)} m²/h`,a/sp]);
  if(g) rows.push(["Glasflächen (Zusatz)",`${num(g,0)} m² ÷ ${GLASS_V} m²/h`,g/GLASS_V]);
 }
 if(["unterhalt","grund","bau"].includes(d.srv)){
  if(sa) rows.push(["Sanitäranlagen",`${sa} × ${SAN_H*60} min`,sa*SAN_H]);
  if(ki) rows.push(["Küchen",`${ki} × ${KIT_H*60} min`,ki*KIT_H]);
 }
 if(["unterhalt","grund"].includes(d.srv)&&rm){
  const rh=d.obj==="hotel"?.3:.08;
  rows.push([d.obj==="hotel"?"Zimmer":"Räume/Büros",`${rm} × ${Math.round(rh*60)} min`,rm*rh]);
 }
 const raw=rows.reduce((s,r)=>s+r[2],0), h=Math.max(raw,MIN_H), f=FREQ[d.freq];
 const lohn=h*p.wage, voll=lohn*(1+p.lnk/100)*(1+p.gk/100), netto=voll*(1+p.gew/100);
 const satz=p.wage*(1+p.lnk/100)*(1+p.gk/100)*(1+p.gew/100);
 const mon=netto*f.m, base=d.srv==="glas"?g:a;
 return{rows,raw,h,f,lohn,voll,netto,satz,mon,hm:h*f.m,hw:h*f.w,team:Math.max(1,Math.ceil(h/4)),
  perM2:base?netto/base:0,base,machines:machines(),minApplied:raw<MIN_H};
}
function machines(){
 const d=S.d,m=[],g=+d.glass||0,add=(n,w)=>{if(!m.some(x=>x.n===n))m.push({n,w})};
 if(d.srv==="unterhalt"&&d.carpet)add("Teppichreiniger","Teppichböden");
 if(d.srv==="grund"){add("Einscheibenmaschine","Hartböden, Grundreinigung");if(d.carpet)add("Teppichreiniger","Teppichböden");}
 if(d.srv==="bau"){if(d.dirt!=="leicht")add("Einscheibenmaschine","Bauschmutz auf Böden");if(d.carpet)add("Teppichreiniger","Teppichböden");}
 if(d.srv==="glas"||g>0)add("Osmose-Reiniger / High Washer","Glas-/Solarflächen");
 if(d.srv==="haus")add("Dachrinnenreiniger","Dachrinnen und Abläufe");
 return m;
}

/* ---------- UI ---------- */
function steps(){$("#steps").innerHTML=[0,1,2,3].map(i=>`<div class="${i<=S.step?"on":""}"></div>`).join("");}
function nav(back,next,label){return `<div class="nav">${back?`<button class="sec" id="bk">Zurück</button>`:""}<button id="nx">${label||"Weiter"}</button></div><div class="err" id="er"></div>`}
function bind(){document.querySelectorAll("[data-k]").forEach(el=>{el.oninput=()=>{S.d[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;if(el.dataset.r)render();};});}
function render(){
 steps();const d=S.d,m=$("#main");
 if(S.step===0){
  m.innerHTML=`<div class="card"><h2>1 · Objekt &amp; Leistung</h2>
  <label>Kunde / Ansprechpartner</label><input data-k="kunde" value="${esc(d.kunde)}" placeholder="Name oder Firma">
  <label>Objektadresse</label><input data-k="adresse" value="${esc(d.adresse)}" placeholder="Straße, PLZ Ort">
  <label>Objekttyp</label><select data-k="obj">${opts(OBJ,d.obj)}</select>
  <label>Hauptleistung</label><select data-k="srv" data-r="1">${opts(SRV,d.srv)}</select>
  ${nav(false)}</div>`;
 }else if(S.step===1){
  const glas=d.srv==="glas";
  m.innerHTML=`<div class="card"><h2>2 · Eckdaten</h2>
  ${glas?"":`<label>Gesamtfläche in m²</label><input data-k="area" type="number" inputmode="decimal" min="0" value="${d.area}" placeholder="z. B. 450">`}
  <div class="g2"><div><label>Zimmer / Büros</label><input data-k="rooms" type="number" inputmode="numeric" min="0" value="${d.rooms}"></div>
  <div><label>Sanitäranlagen (WC/Duschen)</label><input data-k="san" type="number" inputmode="numeric" min="0" value="${d.san}"></div></div>
  <label>Anzahl Küchen</label><input data-k="kit" type="number" inputmode="numeric" min="0" value="${d.kit}">
  ${nav(true)}</div>`;
 }else if(S.step===2){
  const dirt=d.srv==="grund"||d.srv==="bau";
  m.innerHTML=`<div class="card"><h2>3 · Frequenz &amp; Zusatzinfos</h2>
  <label>Frequenz</label><select data-k="freq">${opts(FREQ,d.freq)}</select>
  <label>Glasflächen in m² ${d.srv==="glas"?"(Pflichtangabe)":"(optional)"}</label><input data-k="glass" type="number" inputmode="decimal" min="0" value="${d.glass}">
  ${dirt?`<label>Grad der Verschmutzung</label><select data-k="dirt">${opts(DIRT,d.dirt)}</select>`:""}
  <label class="chk"><input type="checkbox" data-k="carpet" ${d.carpet?"checked":""}> Teppichböden vorhanden</label>
  ${nav(true,true,"Angebot berechnen")}</div>`;
 }else{result();return;}
 bind();
 const bk=$("#bk"),nx=$("#nx");
 if(bk)bk.onclick=()=>{S.step--;render()};
 nx.onclick=()=>{
  const e=validate();if(e){$("#er").textContent=e;return;}
  S.step++;render();window.scrollTo(0,0);
 };
}
function validate(){
 const d=S.d;
 if(S.step===1&&d.srv!=="glas"&&!(+d.area>0))return "Bitte eine Gesamtfläche größer 0 angeben.";
 if(S.step===2&&d.srv==="glas"&&!(+d.glass>0))return "Bitte die Glasfläche in m² angeben.";
 return "";
}
function result(){
 const p=S.p;
 $("#main").innerHTML=`<div class="noprint">
 <div class="tabs"><button id="t1">Kundenangebot</button><button id="t2">Intern (Admin)</button></div>
 <details class="card" open><summary><b>Kalkulationsparameter</b></summary>
  <label>Mitarbeiter-Stundenlohn netto: <span id="wl"></span></label>
  <input type="range" id="wage" min="15" max="22" step="0.5" value="${p.wage}">
  <div class="g2"><div><label>Lohnnebenkosten %</label><input type="number" data-p="lnk" value="${p.lnk}"></div>
